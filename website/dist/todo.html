<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>RV · Todo</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 40px 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 55%, #f093fb 130%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    /* hover / focus / keyframes 只能活在页面样式里（决策 #10 的边界分工） */
    .rv-item  { animation: rv-pop .28s cubic-bezier(.2, .9, .3, 1.25) both; }
    .rv-item:hover  { background: #eef2ff !important; transform: translateX(5px); }
    .rv-del:hover   { background: #fee2e2 !important; color: #ef4444 !important; transform: scale(1.15); }
    .rv-add:hover   { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(102,126,234,.5); }
    .rv-add:active  { transform: translateY(0) scale(.97); }
    .rv-input:focus {
      border-color: #667eea !important; background: #fff !important;
      box-shadow: 0 0 0 4px rgba(102,126,234,.16);
    }
    .rv-check { accent-color: #667eea; }
    .rv-empty { animation: rv-fade .4s ease both; }
    @keyframes rv-pop {
      from { opacity: 0; transform: translateY(-7px) scale(.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes rv-fade { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .rv-item, .rv-empty { animation: none; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="todo.js"></script>
</body>
</html>
