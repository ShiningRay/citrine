version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # 所有 actions 升级合并为一个周 PR，替代每个 action 单独开 PR 的噪音
      github-actions:
        patterns:
          - "*"
