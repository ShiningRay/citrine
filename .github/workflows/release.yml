name: Release

# T-A3：RubyGems Trusted Publishing（OIDC）——打 v* 标签即在**无任何 secret**
# 的情况下构建并发布 gem，消除 RUBYGEMS_API_KEY 卡点。
#
# 一次性前置（仓库管理员在 rubygems.org 操作）：
#   Account settings → Trusted Publishers → 注册本仓库
#   （owner: ShiningRay，repo: citrine，workflow: release.yml，environment: 留空）
on:
  push:
    tags: ["v*"]

jobs:
  gem:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Trusted Publishing（OIDC）必需
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: 安装 JS 工具链（T1：esbuild 是 rake size 的 dev 依赖，随 package-lock 钉版）
        run: npm ci
      - name: 发布门禁（T2：与 CI 对齐——单测 + 桩验收 + lint + 体积守卫）
        run: |
          bundle exec rake
          bundle exec rake stubs
          bundle exec rake lint
          bundle exec rake size
      - name: 构建 gem
        run: gem build citrine.gemspec
      - name: 附产物到 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: citrine-*.gem
      - name: 发布到 RubyGems（Trusted Publishing，无需 API key）
        uses: rubygems/release-gem@v1
