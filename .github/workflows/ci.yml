name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: 单元测试（CRuby）
        run: bundle exec rake
      # 顺带覆盖"该 Ruby 版本能否跑 Opal 编译"：编译一个示例并在 Node 下比对输出（G-11）
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: 数值工具跨平台一致性（G-11）
        run: bundle exec rake parity

  stubs:
    name: 编译 + Node 桩验收
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: 七套桩验收
        run: bundle exec rake stubs
      - name: 数值工具跨平台一致性（G-11）
        run: bundle exec rake parity

  quality:
    name: 体积 / source map / lint（T-A1 + T-A4）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: 产物体积守卫（gzip ≤ 300KB）
        run: bundle exec rake size
      - name: source map 指回 .rb
        run: bundle exec rake map_check
      - name: 框架专属 lint（Citrine/NoRawIvarAssignment）
        run: bundle exec rake lint

  browser:
    name: 真实浏览器布局守卫（T-A2）
    runs-on: ubuntu-latest
    env:
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: headless Chrome 布局守卫（容器尺寸 / 同层兄弟 top）
        run: bundle exec rake browser

  package:
    name: macOS 打包冒烟
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: 打包 CitrineCounter.app
        run: bundle exec bin/citrine package counter
